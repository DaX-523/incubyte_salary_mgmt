# Fly.io settings for the API. Deploy from backend/ with `fly deploy`.
# DATABASE_URL and JWT_SECRET are set with `fly secrets set`, never in this file.
app = "salary-mgmt-api"
# Singapore, next to the database (Supabase ap-southeast-1) and the frontend's functions (sin1).
primary_region = "sin"

[http_service]
  internal_port = 8000
  force_https = true
  # Idle machines are suspended (memory snapshot) and resume on the next request in a few hundred
  # ms, already listening. Suspended machines cost storage only. The first start after a deploy
  # is still a cold boot of a few seconds. Pooled database connections are dead after a suspend;
  # the API replaces them within a few seconds (app/db/engine.py).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Each login's Argon2 check uses 64 MB.
  memory = "512mb"
