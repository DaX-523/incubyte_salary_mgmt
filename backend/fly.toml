# Fly.io settings for the API. Deploy from backend/ with `fly deploy`.
# DATABASE_URL and JWT_SECRET are set with `fly secrets set`, never in this file.
app = "salary-mgmt-api"
# Singapore, next to the database (Supabase ap-southeast-1) and the frontend's functions (sin1).
primary_region = "sin"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine always runs, so no request waits for it to wake. A machine resumed from a suspend
  # finds its pooled database connections dead, and the first request would wait for them to time
  # out (app/db/engine.py). Machines beyond the first, if the app is scaled out, still suspend.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Each login's Argon2 check uses 64 MB.
  memory = "512mb"
